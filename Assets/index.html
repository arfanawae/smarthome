<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SmartHome — ผังไฟบ้าน</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar__title">
      <span class="topbar__eyebrow">SMARTHOME / ผังไฟฟ้าบ้าน</span>
      <h1>สถานะไฟภายในบ้าน</h1>
    </div>
    <div class="topbar__status" id="connStatus">
      <span class="dot"></span> เชื่อมต่อ...
    </div>
  </header>

  <main class="layout">
    <section class="plan-card">
      <svg id="houseSvg" viewBox="0 0 500 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ผังบ้านแสดงสถานะไฟแต่ละห้อง">
        <!-- เส้นกรอบบ้านรวม (เส้นบลูปรินต์) -->
        <rect x="14" y="14" width="472" height="352" fill="none" stroke="#3A5570" stroke-width="1.5" stroke-dasharray="2 4" />

        <g class="room" data-room="living_room">
          <rect x="20" y="20" width="260" height="180" />
          <text x="150" y="115" class="room-label">ห้องนั่งเล่น</text>
        </g>

        <g class="room" data-room="kitchen">
          <rect x="300" y="20" width="180" height="100" />
          <text x="390" y="75" class="room-label">ห้องครัว</text>
        </g>

        <g class="room" data-room="bathroom">
          <rect x="300" y="140" width="90" height="60" />
          <text x="345" y="174" class="room-label room-label--sm">ห้องน้ำ</text>
        </g>

        <g class="room" data-room="storage">
          <rect x="410" y="140" width="70" height="60" />
          <text x="445" y="174" class="room-label room-label--sm">เก็บของ</text>
        </g>

        <g class="room" data-room="bedroom">
          <rect x="20" y="220" width="180" height="140" />
          <text x="110" y="294" class="room-label">ห้องนอน</text>
        </g>

        <g class="room" data-room="garage">
          <rect x="220" y="220" width="260" height="140" />
          <text x="350" y="294" class="room-label">ที่จอดรถ</text>
        </g>
      </svg>
      <p class="plan-hint">แตะห้องในผังหรือใช้การ์ดด้านล่างเพื่อสั่งเปิด/ปิดไฟด้วยตนเอง</p>
    </section>

    <section class="rooms-list" id="roomsList" aria-label="รายการควบคุมไฟแต่ละห้อง">
      <!-- room cards injected by app.js -->
    </section>
  </main>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
